name: Package and release

# Push a tag like v1.0.0 to build the zip and upload it.
# - Always creates a GitHub release with the zip attached.
# - Also uploads to CurseForge once the TOC has "## X-Curse-Project-ID: <id>"
#   and the repo has a CF_API_KEY secret.
# A manual run (workflow_dispatch) only builds the zip and attaches it to the
# run as an artifact; it never publishes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history for the changelog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: leafo/gh-actions-lua@35bcb06abec04ec87df82e08caa84d545348536e # v10
        with:
          luaVersion: "5.1.5"

      - name: Tests must pass before release
        run: |
          for f in *.lua tests/*.lua; do luac -p "$f" || exit 1; done
          lua tests/run.lua
          diff ForeverCDs.toc ForeverCDs_Camelot.toc

      # Secrets are given to this step only. -d skips every upload on manual runs.
      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2
        with:
          args: ${{ github.ref_type != 'tag' && '-d' || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the zip from a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForeverCDs
          path: .release/*.zip
